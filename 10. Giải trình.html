<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Xuất Word Quyền Giải Trình</title>
<script src="https://unpkg.com/pizzip@3.1.2/dist/pizzip.js"></script>
<script src="https://unpkg.com/docxtemplater@3.44.0/build/docxtemplater.js"></script>
<script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 40px;
  line-height: 1.6;
}
label { font-weight: bold; }
textarea { width: 100%; height: 60px; }
</style>
</head>
<body>
<h2>Điền thông tin Quyền Giải Trình</h2>

<label>1️⃣ Chọn loại quyền:</label><br>
<select id="loai_quyen">
  <option value="0">Không được quyền giải trình</option>
  <option value="1">Được quyền giải trình</option>
  <option value="2">Vừa được, vừa không</option>
</select>
<br><br>

<label>2️⃣ Hình thức gửi văn bản:</label><br>
<select id="hinh_thuc">
  <option value="">-- Không chọn --</option>
  <option value="yeucau">Gửi văn bản yêu cầu được giải trình trực tiếp</option>
  <option value="giaitrinh">Gửi văn bản giải trình</option>
</select>
<br><br>

<label>3️⃣ Họ tên người vi phạm (id: 2a1):</label><br>
<input type="text" id="2a1" placeholder="Nhập họ tên người vi phạm">
<br><br>

<label>4️⃣ Người ra quyết định (id: 1a8, 1a9):</label><br>
<input type="text" id="1a8" placeholder="Chức vụ (VD: Trưởng công an xã)">
<input type="text" id="1a9" placeholder="Họ tên người ra quyết định">
<br><br>

<label>5️⃣ Nội dung được quyền giải trình:</label><br>
<textarea id="duoc" placeholder="Điền điểm, khoản, điều..."></textarea><br>

<label>6️⃣ Nội dung không được quyền giải trình:</label><br>
<textarea id="khong" placeholder="Điền điểm, khoản, điều..."></textarea><br>

<button id="exportBtn">Tải file Word</button>

<script>
document.getElementById("exportBtn").addEventListener("click", async () => {
  const loai = document.getElementById("loai_quyen").value;
  const hinhThuc = document.getElementById("hinh_thuc").value;
  const duoc = document.getElementById("duoc").value.trim();
  const khong = document.getElementById("khong").value.trim();
  const tenNguoiViPham = document.getElementById("2a1").value.trim();
  const chucVu = document.getElementById("1a8").value.trim();
  const tenNguoiQD = document.getElementById("1a9").value.trim();

  const response = await fetch("mau_bien_ban.docx");
  const arrayBuffer = await response.arrayBuffer();
  const zip = new PizZip(arrayBuffer);
  const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

  // Checkbox logic
  let check_khong = "☐";
  let check_duoc = "☐";
  if (loai === "0") check_khong = "☒";
  else if (loai === "1") check_duoc = "☒";
  else if (loai === "2") { check_khong = "☒"; check_duoc = "☒"; }

  // --- Logic cho phần thời hạn ---
  let doan2ngay = "Trong thời hạn 02 ngày làm việc, kể từ ngày lập biên bản này, ông (bà) ........................................ là cá nhân vi phạm có quyền gửi văn bản yêu cầu được giải trình trực tiếp đến ........................................ để thực hiện quyền giải trình.";
  let doan5ngay = "Trong thời hạn 05 ngày làm việc, kể từ ngày lập biên bản này, ông (bà) ........................................ là cá nhân vi phạm có quyền gửi văn bản giải trình đến ........................................ để thực hiện quyền giải trình.";

  if (hinhThuc === "yeucau" && tenNguoiViPham && chucVu && tenNguoiQD) {
    doan2ngay = `Trong thời hạn 02 ngày làm việc, kể từ ngày lập biên bản này, ông (bà) ${tenNguoiViPham} là cá nhân vi phạm có quyền gửi văn bản yêu cầu được giải trình trực tiếp đến ${chucVu} ${tenNguoiQD} để thực hiện quyền giải trình.`;
  }
  if (hinhThuc === "giaitrinh" && tenNguoiViPham && chucVu && tenNguoiQD) {
    doan5ngay = `Trong thời hạn 05 ngày làm việc, kể từ ngày lập biên bản này, ông (bà) ${tenNguoiViPham} là cá nhân vi phạm có quyền gửi văn bản giải trình đến ${chucVu} ${tenNguoiQD}, để thực hiện quyền giải trình.`;
  }

  const renderData = {
    check_khong_giai_trinh: check_khong,
    check_duoc_giai_trinh: check_duoc,
    noi_dung_khong_giai_trinh: khong || ".........................................................................",
    noi_dung_duoc_giai_trinh: duoc || ".........................................................................",
    doan_2_ngay: doan2ngay,
    doan_5_ngay: doan5ngay,
  };

  doc.render(renderData);
  const out = doc.getZip().generate({ type: "blob" });
  saveAs(out, "Ket_qua_giai_trinh.docx");
});
</script>
</body>
</html>
